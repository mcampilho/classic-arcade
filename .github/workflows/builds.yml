# Runs the tests and builds Windows, Linux, Android and Web on every push to "main" (or manually):
#  - the files are under the "Actions" tab on GitHub, in "Artifacts";
#  - the Web version is published on GitHub Pages (enable it in Settings → Pages → Source: "GitHub Actions");
#  - pushing a "v*" tag (e.g. git tag v1.0.0 && git push --tags) also creates a Release with
#    the downloadable files.
name: Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and the export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d $dest

      - name: Set up Android (runner SDK + debug key)
        run: |
          keytool -genkeypair -v -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          minor=$(echo $GODOT_VERSION | cut -d. -f1,2)
          for f in editor_settings-4.tres editor_settings-$minor.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Import resources
        run: godot --headless --import

      - name: Check that i18n/strings.gd matches i18n/strings.json
        run: python3 i18n/build.py && git diff --exit-code i18n/strings.gd

      - name: Tests
        run: |
          godot --headless -s res://tests/run_tests.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Export
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p builds/windows builds/linux builds/android builds/web
          godot --headless --export-release "Windows" builds/windows/ClassicArcade.exe
          godot --headless --export-release "Linux" builds/linux/ClassicArcade.x86_64
          godot --headless --export-debug "Android" builds/android/ClassicArcade.apk
          godot --headless --export-release "Web" builds/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicArcade-windows
          path: builds/windows
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicArcade-linux
          path: builds/linux
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicArcade-android
          path: builds/android

      - name: Prepare the Web version for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

      - name: Create the Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd builds
          (cd windows && zip -qr ../ClassicArcade-windows.zip .)
          (cd linux && zip -qr ../ClassicArcade-linux.zip .)
          cp android/ClassicArcade.apk ClassicArcade-android.apk
          (cd web && zip -qr ../ClassicArcade-web.zip .)
          gh release create "$GITHUB_REF_NAME" --title "Classic Arcade $GITHUB_REF_NAME" --generate-notes \
            ClassicArcade-windows.zip ClassicArcade-linux.zip ClassicArcade-android.apk ClassicArcade-web.zip
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

permissions:
  contents: write
  pages: write
  id-token: write
